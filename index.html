      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #00f6ff;
    }

    .neon-glow-left, .neon-glow-right {
      position: absolute;
      top: 50%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 1;
      filter: blur(90px);
      opacity: 0.75;
      animation: neonShift 6s infinite alternate ease-in-out;
    }
    .neon-glow-left { left: -200px; }
    .neon-glow-right { right: -200px; animation-delay: -3s; }

    @keyframes neonShift {
      0% { background: radial-gradient(circle, rgba(255,0,127,0.8) 0%, transparent 70%); }
      33% { background: radial-gradient(circle, rgba(0,246,255,0.8) 0%, transparent 70%); }
      66% { background: radial-gradient(circle, rgba(255,230,0,0.8) 0%, transparent 70%); }
      100% { background: radial-gradient(circle, rgba(123,44,191,0.8) 0%, transparent 70%); }
    }

    .spotlight-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .spotlight-left, .spotlight-right {
      position: absolute;
      width: 120vw;
      height: 250px;
      top: -100px;
      opacity: 0.8;
      filter: blur(15px);
      transform-origin: top center;
    }
    .spotlight-left {
      left: -20vw;
      background: conic-gradient(from 120deg at 20% 0%, rgba(255, 0, 127, 0.8), rgba(0, 246, 255, 0.8), transparent 60deg);
      animation: spotSearchLeft 2s infinite alternate ease-in-out;
    }
    .spotlight-right {
      right: -20vw;
      background: conic-gradient(from 180deg at 80% 0%, rgba(255, 230, 0, 0.8), rgba(255, 0, 127, 0.8), transparent 60deg);
      animation: spotSearchRight 2s infinite alternate ease-in-out;
    }

    @keyframes spotSearchLeft {
      0% { transform: rotate(-25deg); }
      100% { transform: rotate(15deg); }
    }
    @keyframes spotSearchRight {
      0% { transform: rotate(25deg); }
      100% { transform: rotate(-15deg); }
    }

    .retro-panel {
      background: rgba(20, 5, 45, 0.95);
      border: 4px solid #ff007f;
      box-shadow: 0 0 25px #ff007f, inset 0 0 15px rgba(255, 0, 127, 0.3);
      border-radius: 16px;
      overflow: visible !important;
    }

    .winner-card-glow {
      animation: cardPulse 1.2s infinite alternate ease-in-out;
    }
    @keyframes cardPulse {
      0% { box-shadow: 0 0 30px #00f6ff, 0 0 60px #ff007f; transform: scale(1); }
      100% { box-shadow: 0 0 60px #ffe600, 0 0 90px #ff007f; transform: scale(1.03); }
    }

    .font-script { font-family: 'Pacifico', cursive; }
    .font-pixel { font-family: 'Press Start 2P', monospace; }

    .neon-text-pink { color: #ff007f; text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f; }

    .neon-text-yellow { color: #ffe600; text-shadow: 0 0 10px #ffe600, 0 0 20px #ffe600; }

    .hanging-banner {

      border: 4px solid #00f6ff;
      box-shadow: 0 0 25px #00f6ff;
      border-radius: 12px;

    let groupedSectors = [];
    let isSpinning = false;
    let isModalOpen = false;
    let currentAngle = 0;
    let idleSpeed = 0.0025;
    let lastTickIndex = -1;
    let selectedWinnerName = "";
    let centerLogoImg = null;
    let fireworkInterval = null;

    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const pointer = document.getElementById('pointer');
    const sidePanel = document.getElementById('side-panel');
    const winnerModal = document.getElementById('winner-modal');
    const modalImgInput = document.getElementById('modal-img-url');
    const winnerModalIcon = document.getElementById('winner-modal-icon');

    document.getElementById('btn-toggle-panel').addEventListener('click', () => {
      sidePanel.classList.toggle('-translate-x-full');
    });

    modalImgInput.addEventListener('input', (e) => {
      const url = e.target.value.trim();
      if (url) winnerModalIcon.src = url;
    });

    document.getElementById('logo-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            centerLogoImg = img;
            drawWheel();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function updateSectors() {
      groupedSectors = [];
      const total = rawParticipants.length;
      if (total === 0) return;
      const maxSectors = Math.min(24, total);
      const itemsPerSector = Math.ceil(total / maxSectors);

      for (let i = 0; i < maxSectors; i++) {
        const start = i * itemsPerSector;
        const end = Math.min(start + itemsPerSector, total);
        const members = rawParticipants.slice(start, end);
        if (members.length > 0) {
          let label = members.length === 1 ? members[0] : `${members[0]} - ${members[members.length - 1]}`;
          groupedSectors.push({ label: label, members: members });
        }
      }
    }

    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 30;

      ctx.clearRect(0, 0, size, size);
      const numSectors = groupedSectors.length;
      if (numSectors === 0) return;

      const arc = (Math.PI * 2) / numSectors;
      const colorPalettes = [
        { main: '#ff007f', light: '#ff66b3', dark: '#b30059' },
        { main: '#00f6ff', light: '#80fbff', dark: '#00acb3' },
        { main: '#ffe600', light: '#fff066', dark: '#b3a200' },
        { main: '#7b2cbf', light: '#ad63e6', dark: '#521d80' },
        { main: '#00f5d4', light: '#80faea', dark: '#00ac95' },
        { main: '#ff5400', light: '#ff9766', dark: '#b33b00' }
      ];

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(currentAngle);

      ctx.beginPath();
      ctx.arc(0, 8, radius + 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fill();

      for (let i = 0; i < numSectors; i++) {
        const angle = i * arc;
        const pal = colorPalettes[i % colorPalettes.length];

        const radGrad = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius);
        radGrad.addColorStop(0, pal.light);
        radGrad.addColorStop(0.7, pal.main);
        radGrad.addColorStop(1, pal.dark);

        ctx.beginPath();
        ctx.fillStyle = radGrad;
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, angle, angle + arc);
        ctx.lineTo(0, 0);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
        ctx.shadowOffsetY = 2;
        ctx.shadowBlur = 4;

        let fontSize = Math.max(10, Math.min(14, Math.floor(220 / numSectors)));
        ctx.font = `900 ${fontSize}px 'Righteous', sans-serif`;
        ctx.fillText(groupedSectors[i].label, radius - 30, fontSize / 3);
        ctx.restore();
      }

      const innerShadow = ctx.createRadialGradient(0, 0, radius - 15, 0, 0, radius);
      innerShadow.addColorStop(0, 'rgba(0,0,0,0)');
      innerShadow.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = innerShadow;
      ctx.fill();

      const rimGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
      rimGrad.addColorStop(0, '#ffffff');
      rimGrad.addColorStop(0.3, '#ff007f');
      rimGrad.addColorStop(0.7, '#11052c');
      rimGrad.addColorStop(1, '#00f6ff');

      ctx.beginPath();
      ctx.arc(0, 0, radius + 8, 0, Math.PI * 2);
      ctx.strokeStyle = rimGrad;
      ctx.lineWidth = 16;
      ctx.stroke();

      const hubRadius = radius * 0.22;
      
      if (centerLogoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(centerLogoImg, -hubRadius, -hubRadius, hubRadius * 2, hubRadius * 2);
        ctx.restore();
      } else {
        const hubGrad = ctx.createRadialGradient(-10, -10, 5, 0, 0, hubRadius);
        hubGrad.addColorStop(0, '#ffffff');
        hubGrad.addColorStop(0.3, '#ffe600');
        hubGrad.addColorStop(0.9, '#ff9900');
        hubGrad.addColorStop(1, '#b36b00');

        ctx.beginPath();
        ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
        ctx.fillStyle = hubGrad;
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowOffsetY = 5;
        ctx.shadowBlur = 10;
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || isModalOpen || rawParticipants.length === 0) return;
      isSpinning = true;

      const totalParticipants = rawParticipants.length;
      const duration = parseInt(document.getElementById('spin-duration').value) * 1000;
      const winningIndex = Math.floor(Math.random() * totalParticipants);
      selectedWinnerName = rawParticipants[winningIndex];

      const participantArc = (Math.PI * 2) / totalParticipants;
      const startAngle = currentAngle;
      
      const targetAngle = startAngle + (Math.PI * 2 * 8) - (startAngle % (Math.PI * 2)) - (winningIndex * participantArc) - (participantArc / 2);
      const deltaAngle = targetAngle - startAngle;
      const startTime = performance.now();

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const easeOutQuint = 1 - Math.pow(1 - progress, 5);
        currentAngle = startAngle + deltaAngle * easeOutQuint;

        drawWheel();

        const normalizedAngle = ((2 * Math.PI) - (currentAngle % (Math.PI * 2)) + (Math.PI * 20)) % (Math.PI * 2);
        const currentPassedIndex = Math.floor(normalizedAngle / participantArc) % totalParticipants;

        if (currentPassedIndex !== lastTickIndex) {
          playTick();
          document.getElementById('live-name').innerText = rawParticipants[currentPassedIndex] || "...";
          pointer.style.transform = 'rotate(-15deg)';
          setTimeout(() => { pointer.style.transform = 'rotate(0deg)'; }, 30);
          lastTickIndex = currentPassedIndex;
        }

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          isSpinning = false;
          document.getElementById('live-name').innerText = selectedWinnerName;
          showWinnerModal(selectedWinnerName);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function mainLoop() {
      if (!isSpinning) {
        currentAngle += idleSpeed;
        drawWheel();
      }
      requestAnimationFrame(mainLoop);
    }

    const textarea = document.getElementById('participants-input');
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== textarea && document.activeElement !== modalImgInput) {
        e.preventDefault();
        if (isModalOpen) {
          closeWinnerModal();
        } else {
          spinWheel();
        }
      }
    });

    function triggerGrandFireworks() {
      const duration = 3000;
      const animationEnd = Date.now() + duration;

      fireworkInterval = setInterval(() => {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(fireworkInterval);

        const particleCount = 50 * (timeLeft / duration);

        confetti({ particleCount, angle: 60, spread: 80, origin: { x: 0, y: 0.8 }, colors: ['#ff007f', '#00f6ff', '#ffe600'] });
        confetti({ particleCount, angle: 120, spread: 80, origin: { x: 1, y: 0.8 }, colors: ['#ff007f', '#00f6ff', '#ffe600'] });
        confetti({ particleCount: particleCount * 0.5, angle: 90, spread: 120, origin: { x: 0.5, y: 0.3 }, colors: ['#ffffff', '#00f5d4', '#ff5400'] });
      }, 250);
    }

    function showWinnerModal(winnerName) {
      isModalOpen = true;
      triggerGrandFireworks();
      
      document.getElementById('winner-name').innerText = winnerName;
      winnerModal.classList.remove('hidden');

      rawParticipants = rawParticipants.filter(p => p !== winnerName);
      textarea.value = rawParticipants.join('\n');
      document.getElementById('count-display').innerText = rawParticipants.length;
      updateSectors();
    }

    function closeWinnerModal() {
      isModalOpen = false;
      if (fireworkInterval) clearInterval(fireworkInterval);
      winnerModal.classList.add('hidden');
    }

    // INITIALIZATION DENGAN NAMA PESERTA HARCODED
    textarea.value = rawParticipants.join('\n');
    document.getElementById('count-display').innerText = rawParticipants.length;
    updateSectors();

    textarea.addEventListener('input', () => {
      const text = textarea.value.trim();
      rawParticipants = text ? text.split('\n').map(s => s.trim()).filter(Boolean) : [];
      document.getElementById('count-display').innerText = rawParticipants.length;
      updateSectors();
      drawWheel();
    });

    document.getElementById('btn-shuffle').addEventListener('click', () => {
      rawParticipants.sort(() => Math.random() - 0.5);
      textarea.value = rawParticipants.join('\n');
      updateSectors();
      drawWheel();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      textarea.value = '';
      rawParticipants = [];
      document.getElementById('count-display').innerText = 0;
      updateSectors();
      drawWheel();
    });

    document.getElementById('spin-duration').addEventListener('input', (e) => {
      document.getElementById('duration-val').innerText = `${e.target.value}s`;
    });

    mainLoop();
